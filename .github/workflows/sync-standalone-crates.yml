name: Sync standalone crate repositories

on:
  push:
    branches:
      - main
    paths:
      - "djvulibrust/**"
      - "legencode/src/jbig2enc-rust/**"
      - ".github/workflows/sync-standalone-crates.yml"
  workflow_dispatch:
    inputs:
      force_mirror:
        description: "Force-push mirror branches. Use only for the first cutover or intentional mirror reset."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: sync-standalone-crates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync ${{ matrix.name }}
    if: github.repository == 'LegeApp/Lege'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: jbig2enc-rust
            prefix: legencode/src/jbig2enc-rust
            repository: LegeApp/jbig2enc-rust
            branch: main
          - name: DJVULibRust
            prefix: djvulibrust
            repository: LegeApp/DJVULibRust
            branch: main

    steps:
      - name: Checkout Lege
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check mirror token
        env:
          MIRROR_TOKEN: ${{ secrets.LEGEAPP_MIRROR_TOKEN }}
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "Missing LEGEAPP_MIRROR_TOKEN secret. Create a fine-grained PAT with Contents: Read and write for the mirror repositories." >&2
            exit 1
          fi

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Split subtree
        id: split
        run: |
          split_sha="$(git subtree split --prefix='${{ matrix.prefix }}' HEAD)"
          echo "sha=$split_sha" >> "$GITHUB_OUTPUT"
          echo "Split ${{ matrix.prefix }} at $split_sha"

      - name: Push mirror
        env:
          MIRROR_TOKEN: ${{ secrets.LEGEAPP_MIRROR_TOKEN }}
          FORCE_MIRROR: ${{ github.event.inputs.force_mirror || 'false' }}
        run: |
          remote_url="https://x-access-token:${MIRROR_TOKEN}@github.com/${{ matrix.repository }}.git"
          refspec="${{ steps.split.outputs.sha }}:refs/heads/${{ matrix.branch }}"

          if [ "$FORCE_MIRROR" = "true" ]; then
            git push --force-with-lease "$remote_url" "$refspec"
          else
            git push "$remote_url" "$refspec"
          fi
