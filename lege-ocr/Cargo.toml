[package]
name = "lege-ocr"
version = "0.1.0"
edition = "2024"
description = "Slow OCR pipeline for Lege — line-level preprocessing and hOCR assembly"

[lib]
name = "lege_ocr"
path = "src/lib.rs"

[[bin]]
name = "lege-ocr-debug"
path = "src/bin/lege_ocr_debug.rs"
required-features = ["debug-bin"]

[dependencies]
anyhow = { workspace = true }
blake3 = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rayon = { workspace = true }
lege-gpu = { path = "../lege-gpu", features = ["layout-detection"] }
# Serves the `lege-ocr-debug` binary only — nothing under `src/` outside
# `src/bin/` touches it. Optional because `[[bin]] required-features` does not
# gate dependency resolution: left unconditional it entered the dependency
# graph of every `lege-ocr` consumer, `lege-process` included.
env_logger = { version = "0.11.11", optional = true }

# blake3's build script compiles a NEON C kernel on aarch64, which drags an
# NDK C toolchain into what is otherwise a pure-Rust build — including for
# `cargo check`, which does not otherwise need one. `pure` selects the portable
# Rust implementation instead. blake3 is used here for cache keys, not on any
# hot path, so the throughput difference does not register.
[target.'cfg(target_os = "android")'.dependencies]
blake3 = { workspace = true, features = ["pure"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
tesseract = { version = "0.15.2", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_System_Com",
    "Win32_System_WinRT",
] }
windows-core = { workspace = true }

[features]
default = []
# The standalone `lege-ocr-debug` binary and its logging dependency.
debug-bin = ["dep:env_logger"]
# Android platform support: routes `default_engine()` to the embedded PP-OCR
# backend, which is pure Rust on lege-gpu and needs no system OCR service.
android = []
tesseract-ocr = ["dep:tesseract"]
paddle-ocr = []
trocr = []

[dev-dependencies]
tempfile = { workspace = true }
