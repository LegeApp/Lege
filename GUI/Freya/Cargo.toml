[package]
name = "lege-gui"
version = "1.0.0"
edition = "2024"

[[bin]]
name = "lege-gui"
path = "src/main.rs"

[features]
default = []
dark-mode = []
# Enables in-app debug tooling (debug-log viewer, Sanzo Wada theme browser) and
# turns on the core crate's debug logging. Build via the workspace alias
# `cargo build-debug-logging` / `cargo run-debug-logging`.
debug-logging = ["lege/debug-logging"]

[dependencies]
# Keep this feature set aligned with the published Windows Skia binary cache.
# Slimmer sets such as only `skia-engine` request a non-existent Skia archive
# and fall back to a local LLVM/clang Skia build.
freya = { path = "../../freya-main/crates/freya", default-features = false, features = ["cpu-renderer"] }
rfd = { path = "../rfd" }
tokio = { version = "1.49", features = ["rt", "rt-multi-thread", "macros", "fs", "time", "sync", "process", "io-util"] }
anyhow = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
dirs = "6.0"
lege = { path = "../.." }
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
once_cell = "1.19"
raw-window-handle = "0.6"
atty = "0.2.14"
flume = { workspace = true }

[build-dependencies]
embed-resource = "3.0"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["wincon", "winuser"] }
windows = { workspace = true, features = [
  "Foundation",
  "Win32_Storage_Packaging_Appx",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Com",
  "Win32_Foundation"
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
