[package]
name = "dioxus-gui"
version = "1.0.0"
edition = "2024"

[[bin]]
name = "lege-gui"
path = "src/main.rs"

# Prevent console window on all platforms

# NOTE: Profile settings moved to workspace root Cargo.toml
# [profile.dev]
# strip = false

[features]
default = ["gui"]
gui = ["dirs"]
debug-logging = ["lege/debug-logging", "Legencode/debug-logging"]
cotinga-theme = []

[dependencies]
# Dioxus GUI framework
dioxus = { version = "0.6.3", features = ["desktop"] }
dioxus-desktop = "0.6.3"

# File dialogs
rfd = "0.15"

# Async runtime
tokio = { version = "1.47.1", features = ["rt", "rt-multi-thread", "macros", "fs", "time"] }

# Error handling
anyhow = "1.0"

# Serialization for settings persistence
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

# Standard library additions
dirs = { version = "6.0", optional = true }

# Local dependencies
Legencode = { path = "../../Legencode" }
lege = { path = "../.." }

# Additional dependencies for Dioxus
uuid = { version = "1.0", features = ["v4"] }
image = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
once_cell = "1.19"
raw-window-handle = "0.6"
atty = "0.2.14"

[build-dependencies]
# Windows resource embedding for icon
winres = "0.1"

[target.'cfg(windows)'.dependencies]
# Windows API for hiding console window
winapi = { version = "0.3", features = ["wincon", "winuser"] }
# Windows Payment API
windows = { workspace = true, features = [
  "Foundation",
  "Win32_Storage_Packaging_Appx",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Com",
  "Win32_Foundation"
] }

[target.'cfg(unix)'.dependencies]
# Unix system calls for process management
libc = "0.2"

# NOTE: Profile settings moved to workspace root Cargo.toml
# [profile.release]
# lto = "fat"
# codegen-units = 4
# panic = "unwind"
# opt-level = 3
# debug = false
# strip = true
