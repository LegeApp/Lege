# Lege ecosystem workspace root.
#
# This virtual manifest ties together every sub-program of the Lege ecosystem:
#   * lege-process  — the PDF processor CLI (`lege`) + core library and its GUIs
#   * lege-gpu       — shared wgpu compute backend (binarization, resize, ONNX)
#   * lege-ocr       — OCR pipeline library + debug binary
#   * lege-pdf/write — typed, append-only PDF emitter
#   * lege-pdf/read  — Lege-owned document intake/read seam
#   * lege-pdf/render— native Lege PDF document and rendering engine
#   * lege-codecs/*  — JBIG2 / JPEG2000 / DjVu codecs (own build graphs — excluded,
#                      linked codecs are wired in via [patch] below)
#
# Build shortcuts live in `.cargo/config.toml` (e.g. `cargo process`, `cargo gui`).
[workspace]
resolver = "2"
members = [
    "lege-process",             # `lege` CLI + core processing library
    "lege-process/lege-ipc",    # shared IPC/log types
    "lege-process/GUI/musicsheet", # `lege-music-gui`
    "lege-process/GUI/rfd",     # vendored file-dialog crate used by both GUIs
    "lege-gpu",                 # `lege_gpu`
    "lege-ocr",                 # `lege_ocr`
    "lege-pdf/read",            # renderer-backed document intake/read seam
    "lege-pdf/render/crates/*", # native PDF document + rendering engine
    "lege-pdf/write",           # `lege-pdf-write`
    "lege-viewer",              # `lege-gui`: native viewer + processing workspace
    "lege-misc/xtask",          # packaging tasks (`cargo appimage`)
]
# Kept out of the workspace on purpose:
#   freya-main               — vendored upstream fork with its own workspace
#   lege-codecs/*            — separate build graphs / licenses (patched in below)
exclude = [
    "freya-main",
    "lege-codecs",
]
default-members = [
    "lege-process",
    "lege-viewer",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LegeApp/Lege"

[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"
unused_imports = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(windows_slim_errors)', 'cfg(trace_arith)', 'cfg(feature, values("cotinga-theme", "debug-logging", "german", "layout-detection", "music-sheet", "ocr", "paddle-ocr", "tesseract-ocr", "trace_arith"))'] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.dependencies]
anyhow = { version = "1.0.103", features = ["backtrace"] }
proc-macro2 = { version = "1.0", default-features = false }
quote = { version = "1.0", default-features = false }
syn = { version = "2.0", default-features = false }
num_cpus = "1.17"
serde = { version = "1.0.228", features = ["derive"] }
config = { version = "0.15.25", features = ["toml"] }
thiserror = "2.0.18"
serde_json = "1.0.150"
log = "0.4.33"
once_cell = "1.21.4"
rayon = "1.11.0"
image = { version = "0.25.10", features = ["png", "jpeg", "tiff"] }
jpeg-encoder = { version = "=0.7.1", features = ["simd"] }
flume = "0.11"
# Native renderer crates. Their single canonical source tree is in
# `lege-pdf/render`; the viewer consumes these APIs directly.
pdf-color = { path = "lege-pdf/render/crates/pdf-color" }
pdf-content = { path = "lege-pdf/render/crates/pdf-content" }
pdf-document = { path = "lege-pdf/render/crates/pdf-document" }
pdf-font = { path = "lege-pdf/render/crates/pdf-font" }
pdf-function = { path = "lege-pdf/render/crates/pdf-function" }
pdf-geom = { path = "lege-pdf/render/crates/pdf-geom" }
pdf-image = { path = "lege-pdf/render/crates/pdf-image" }
pdf-object = { path = "lege-pdf/render/crates/pdf-object" }
pdf-page-ir = { path = "lege-pdf/render/crates/pdf-page-ir" }
pdf-postprocess = { path = "lege-pdf/render/crates/pdf-postprocess" }
pdf-profiling = { path = "lege-pdf/render/crates/pdf-profiling" }
pdf-read = { path = "lege-pdf/render/crates/pdf-read" }
pdf-render-api = { path = "lege-pdf/render/crates/pdf-render-api" }
pdf-render-cpu = { path = "lege-pdf/render/crates/pdf-render-cpu" }
pdf-render-scheduler = { path = "lege-pdf/render/crates/pdf-render-scheduler" }
pdf-render-wgpu = { path = "lege-pdf/render/crates/pdf-render-wgpu" }
pdf-security = { path = "lege-pdf/render/crates/pdf-security" }
pdf-source = { path = "lege-pdf/render/crates/pdf-source" }
pdf-structure = { path = "lege-pdf/render/crates/pdf-structure" }
pdf-syntax = { path = "lege-pdf/render/crates/pdf-syntax" }
pdf-test-support = { path = "lege-pdf/render/crates/pdf-test-support" }
pdf-text = { path = "lege-pdf/render/crates/pdf-text" }
memmap2 = "0.9"
crossbeam-channel = "0.5"
arc-swap = "1.7"
jp2lam = { path = "lege-codecs/jp2lam", default-features = false }
jbig2enc-rust = { path = "lege-codecs/jbig2enc-rust", default-features = false, features = ["decode"] }
hayro-ccitt = "0.3"
tempfile = "3.27.0"
flate2 = { version = "1.1.9", features = ["zlib-rs"] }
zip = { version = "8.6.0", default-features = false }
miniz_oxide = "0.8"
lazy_static = "1.5.0"
ndarray = { version = "0.17.2", features = ["rayon"] }
bytemuck = { version = "1.25.1", features = ["derive", "extern_crate_alloc"] }
cfg-if = "1.0.4"
html-escape = "0.2.13"
itertools = "0.15.0"
console = "0.16.4"
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
console_error_panic_hook = "0.1.7"
ttf-parser = "0.25.1"
encoding_rs = "0.8.35"
wait-timeout = "0.2.1"
byteorder = "1.5.0"
bitvec = "1.0.1"
chrono = "0.4.45"

generational-box = "0.7"
tracing = "0.1.41"
bitflags = "2.9.3"
futures-util = "0.3.32"
futures-channel = "0.3.32"
futures-lite = "2.6.1"
async-io = "2.5.0"
blocking = "1.6.2"
ureq = "3.1.4"
url = "2.5"
open = "5.1"
async-broadcast = "0.7.2"
easer = "0.3.0"
ropey = "1.6.1"
keyboard-types = "0.8.0"
euclid = "0.22.9"
bytes = "1.12.1"
rfd = "0.17"
cosmic-text = "0.19.0"
copypasta = "0.10"
softbuffer = "0.4.8"
tiny-skia = "0.12.0"
raw-window-handle = "0.6.0"
winit = "0.30.13"
tray-icon = "0.21"
gl = "0.14.0"
glutin = "0.32.0"
glutin-winit = "0.5.0"
ash-window = "0.13.0"
accesskit = "0.24.0"
accesskit_winit = "0.32.0"
hotpath = "0.14"
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "fs"] }
ash = { version = "0.38", default-features = false, features = ["loaded"] }
rustc-hash = "2.1.3"

windows = { version = "0.62.2", default-features = false }
windows-core = { version = "0.62.2", default-features = false }
windows-future = { version = "0.3.2", default-features = false }

# The JBIG2 and JPEG2000 codecs now live in-tree under lege-codecs/. Point the
# historical Git coordinates at those local checkouts so `lege` links the vendored
# source (no network needed) while the codec folders keep their own build graphs.
[patch."https://github.com/LegeApp/jbig2enc-rust.git"]
jbig2enc-rust = { path = "lege-codecs/jbig2enc-rust" }

[patch."https://github.com/LegeApp/jp2lam.git"]
jp2lam = { path = "lege-codecs/jp2lam" }

# ---------------------------------------------------------------------------
# Build profiles (must live in the workspace root).
# ---------------------------------------------------------------------------
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
debug = false
strip = "symbols"
incremental = false
overflow-checks = false

# Optimize incremental compilation
[profile.dev]
incremental = true
codegen-units = 256
split-debuginfo = "packed"

# Profile for debug-logging builds with debug symbols enabled for flamegraph profiling
[profile.profiling]
inherits = "release"
lto = false        # Disable LTO for faster compilation during profiling
codegen-units = 16  # Allow more codegen units for faster builds
incremental = true  # Enable incremental compilation
debug = true
strip = false

# Profile for debug-logging builds without LTO for faster compilation
[profile.debug-fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
debug = true
strip = false
