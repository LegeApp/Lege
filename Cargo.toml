# Lege ecosystem workspace root.
#
# This virtual manifest ties together every sub-program of the Lege ecosystem:
#   * lege-process  — the PDF processor CLI (`lege`) + core library and its GUIs
#   * lege-gpu       — shared wgpu compute backend (binarization, resize, ONNX)
#   * lege-ocr       — OCR pipeline library + debug binary
#   * lege-pdf/write — typed, append-only PDF emitter
#   * lege-pdf/read  — Lege-owned document intake/read seam
#   * lege-pdf/agent — agent-facing structured PDF CLI (`lege-pdf`)
#   * lege-pdf/render— native Lege PDF document and rendering engine
#   * lege-codecs/*  — JBIG2 / JPEG2000 / DjVu codecs (own build graphs — excluded,
#                      linked codecs are wired in via [patch] below)
#
# Build shortcuts live in `.cargo/config.toml` (e.g. `cargo process`, `cargo gui`).
[workspace]
resolver = "2"
members = [
    "lege-process",             # `lege` CLI + core processing library
    "lege-process/lege-ipc",    # shared IPC/log types
    "lege-process/GUI/musicsheet", # `lege-music-gui`
    "lege-process/GUI/Freya",   # `lege-gui`: Skia/Freya processor GUI (default frontend)
    "lege-process/GUI/rfd",     # vendored file-dialog crate used by both GUIs
    "lege-gpu",                 # `lege_gpu`
    "lege-ocr",                 # `lege_ocr`
    "lege-document-ocr/crates/*", # business-grade OCR product libraries
    "lege-document-ocr/cli",    # package `lege-document-ocr-cli`, binary `lege-ocr`
    "lege-document-ocr/installer-winsafe", # native Windows installer/uninstaller
    "lege-pdf/read",            # renderer-backed document intake/read seam
    "lege-pdf/agent",           # agent-facing `lege-pdf` CLI (structured PDF tool)
    "lege-pdf/render/crates/*", # native PDF document + rendering engine
    "lege-pdf/write",           # `lege-pdf-write`
    "lege-viewer",              # `lege-viewer`: native viewer + processing workspace
    "lege-misc/bindings/lege-render-ffi", # C ABI over the renderer facade
    "lege-misc/xtask",          # packaging tasks (`cargo appimage`)
    "lege-android",             # JNI cdylib for the Android APK
]
# Kept out of the workspace on purpose:
#   freya-main               — vendored upstream fork with its own workspace
#   lege-codecs/*            — separate build graphs / licenses (patched in below)
#   lege-pdf/pdf-integrity   — nested forensic-triage workspace (own lockfile)
#   lege-misc/bindings/jbig2enc-py — pyo3 extension module; `extension-module`
#                              leaves Python symbols unresolved until import,
#                              which breaks any plain `cargo build` that links
#                              an executable. Built with maturin, not cargo.
#                              The C ABI binding next to it has no such
#                              constraint and is a normal member below.
exclude = [
    "freya-main",
    "lege-codecs",
    "lege-misc/bindings/jbig2enc-py",
    "lege-pdf/pdf-integrity",
]
# `cargo build` produces the `lege` CLI plus the default GUI frontend, the
# Freya processor GUI (bin `lege-gui`). The native viewer is an opt-in
# frontend: build it with `cargo viewer` (bin `lege-viewer`).
default-members = [
    "lege-process",
    "lege-process/GUI/Freya",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
repository = "https://github.com/LegeApp/Lege"

[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"
unused_imports = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(windows_slim_errors)', 'cfg(trace_arith)', 'cfg(feature, values("cotinga-theme", "debug-logging", "german", "layout-detection", "music-sheet", "ocr", "paddle-ocr", "tesseract-ocr", "trace_arith"))'] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.dependencies]
anyhow = { version = "1.0.103", features = ["backtrace"] }
proc-macro2 = { version = "1.0", default-features = false }
quote = { version = "1.0", default-features = false }
syn = { version = "2.0", default-features = false }
num_cpus = "1.17"
serde = { version = "1.0.228", features = ["derive"] }
# `default-features = false`: the default set also enables the ini/json/json5/
# ron/yaml backends, and the yaml one drags `yaml-rust2` + `encoding_rs` into
# every binary. Lege only ever reads TOML (`core/types.rs` builds its
# `config::File` with `FileFormat::Toml`).
config = { version = "0.15.25", default-features = false, features = ["toml"] }
thiserror = "2.0.18"
serde_json = "1.0.150"
log = "0.4.33"
once_cell = "1.21.4"
rayon = "1.11.0"
# `default-features = false` is load-bearing. `image`'s default set is
# `default-formats`, which pulls a complete AV1 *encoder* (`ravif` → `rav1e` →
# `av-scenechange`, `av1-grain`, `v_frame`, `bitstream-io`, …), OpenEXR
# (`exr` → `pulp`, `half`, `raw-cpuid`, `zune-inflate`), `gif` and `qoi` —
# roughly fifty crates for formats Lege never reads or writes. The enabled set
# is exactly what the pipeline accepts: `SUPPORTED_IMAGE_EXTENSIONS` in
# `lege-process/pipeline/source.rs` (png/jpeg/pnm/tiff/bmp; `jp2` goes to the
# in-tree `jp2lam`) plus `webp`, which `is_raster_image_path` in
# `lege-process/core/main.rs` accepts as a CLI input. `rayon` was part of the
# default set and is kept so `imageops` stays parallel.
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "tiff",
    "bmp",
    "pnm",
    "webp",
    "rayon",
] }
jpeg-encoder = { version = "=0.7.1", features = ["simd"] }
# Single PNG version for the whole workspace: `lege-process/colorquant` needs
# the palette/`ColorType::Indexed` encoder that `image` does not expose, and the
# agent/`pdf-cli` tools write PNGs directly. Pinning it here stops 0.17 and 0.18
# both being compiled in one workspace build.
png = "0.18"
flume = "0.11"
# Native renderer crates. Their single canonical source tree is in
# `lege-pdf/render`; the viewer consumes these APIs directly.
pdf-color = { path = "lege-pdf/render/crates/pdf-color" }
pdf-content = { path = "lege-pdf/render/crates/pdf-content" }
pdf-document = { path = "lege-pdf/render/crates/pdf-document" }
pdf-font = { path = "lege-pdf/render/crates/pdf-font" }
pdf-function = { path = "lege-pdf/render/crates/pdf-function" }
pdf-geom = { path = "lege-pdf/render/crates/pdf-geom" }
pdf-image = { path = "lege-pdf/render/crates/pdf-image" }
pdf-object = { path = "lege-pdf/render/crates/pdf-object" }
pdf-page-ir = { path = "lege-pdf/render/crates/pdf-page-ir" }
pdf-postprocess = { path = "lege-pdf/render/crates/pdf-postprocess" }
pdf-profiling = { path = "lege-pdf/render/crates/pdf-profiling" }
pdf-read = { path = "lege-pdf/render/crates/pdf-read" }
pdf-render-api = { path = "lege-pdf/render/crates/pdf-render-api" }
pdf-render-cpu = { path = "lege-pdf/render/crates/pdf-render-cpu" }
pdf-render-scheduler = { path = "lege-pdf/render/crates/pdf-render-scheduler" }
pdf-render-wgpu = { path = "lege-pdf/render/crates/pdf-render-wgpu" }
pdf-security = { path = "lege-pdf/render/crates/pdf-security" }
pdf-source = { path = "lege-pdf/render/crates/pdf-source" }
pdf-structure = { path = "lege-pdf/render/crates/pdf-structure" }
pdf-syntax = { path = "lege-pdf/render/crates/pdf-syntax" }
pdf-test-support = { path = "lege-pdf/render/crates/pdf-test-support" }
pdf-text = { path = "lege-pdf/render/crates/pdf-text" }
memmap2 = "0.9"
crossbeam-channel = "0.5"
arc-swap = "1.7"
jp2lam = { path = "lege-codecs/jp2lam", default-features = false }
jbig2enc-rust = { path = "lege-codecs/jbig2enc-rust", default-features = false, features = ["decode"] }
hayro-ccitt = "0.3"
tempfile = "3.27.0"
flate2 = { version = "1.1.9", features = ["zlib-rs"] }
zip = { version = "8.6.0", default-features = false }
miniz_oxide = "0.8"
lazy_static = "1.5.0"
ndarray = { version = "0.17.2", features = ["rayon"] }
bytemuck = { version = "1.25.1", features = ["derive", "extern_crate_alloc"] }
cfg-if = "1.0.4"
html-escape = "0.2.13"
itertools = "0.15.0"
console = "0.16.4"
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
console_error_panic_hook = "0.1.7"
encoding_rs = "0.8.35"
byteorder = "1.5.0"
bitvec = "1.0.1"
chrono = "0.4.45"
blake3 = "1.8.2"
clap = { version = "4.5.60", features = ["derive"] }
rusqlite = { version = "0.38.0", features = ["bundled"] }

generational-box = "0.7"
tracing = "0.1.41"
bitflags = "2.9.3"
futures-util = "0.3.32"
futures-channel = "0.3.32"
futures-lite = "2.6.1"
async-io = "2.5.0"
blocking = "1.6.2"
ureq = "3.1.4"
url = "2.5"
open = "5.1"
async-broadcast = "0.7.2"
easer = "0.3.0"
ropey = "1.6.1"
keyboard-types = "0.8.0"
euclid = "0.22.9"
bytes = "1.12.1"
rfd = "0.17"
cosmic-text = "0.19.0"
copypasta = "0.10"
softbuffer = "0.4.8"
tiny-skia = "0.12.0"
raw-window-handle = "0.6.0"
winit = "0.30.13"
tray-icon = "0.21"
gl = "0.14.0"
glutin = "0.32.0"
glutin-winit = "0.5.0"
ash-window = "0.13.0"
