accesskit_winit = "0.32.0"
hotpath = "0.14"
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "fs"] }
ash = { version = "0.38", default-features = false, features = ["loaded"] }
rustc-hash = "2.1.3"

windows = { version = "0.62.2", default-features = false }
windows-core = { version = "0.62.2", default-features = false }
windows-future = { version = "0.3.2", default-features = false }

# The JBIG2 and JPEG2000 codecs now live in-tree under lege-codecs/. Point the
# historical Git coordinates at those local checkouts so `lege` links the vendored
# source (no network needed) while the codec folders keep their own build graphs.
[patch."https://github.com/LegeApp/jbig2enc-rust.git"]
jbig2enc-rust = { path = "lege-codecs/jbig2enc-rust" }

[patch."https://github.com/LegeApp/jp2lam.git"]
jp2lam = { path = "lege-codecs/jp2lam" }

# ---------------------------------------------------------------------------
# Build profiles (must live in the workspace root).
# ---------------------------------------------------------------------------
# `panic = "unwind"` is load-bearing, not a default. The PDF renderer contains
# the panic from one poisoned page behind `catch_unwind` boundaries
# (`pdf_render_api::submit_caught` / `render_blocking`, the scheduler's
# `render_job`, and the wgpu backend's GPU→CPU fallback) so a malformed
# document degrades to a typed per-page `RenderError` instead of taking down
# the viewer, the CLI, or an embedding host. Under `panic = "abort"` every one
# of those guards is inert and the promise their docs make is false. The
# `chaos` mutation suite gates the same invariant, so aborting here would also
# mean the never-panic gate only ever ran in a profile that never ships.
# The C ABI in `lege-misc/bindings/lege-render-ffi` depends on this too, and
# more sharply: a panic crossing an `extern "C"` frame is undefined behaviour,
# so under `abort` every non-Rust consumer turns a malformed PDF into a killed
# host process, with no compile error to warn anyone.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
opt-level = 3
debug = false
strip = "symbols"
incremental = false
overflow-checks = false

# Optimize incremental compilation
[profile.dev]
incremental = true
codegen-units = 256
split-debuginfo = "packed"

# Profile for debug-logging builds with debug symbols enabled for flamegraph profiling
[profile.profiling]
inherits = "release"
lto = false        # Disable LTO for faster compilation during profiling
codegen-units = 16  # Allow more codegen units for faster builds
incremental = true  # Enable incremental compilation
debug = true
strip = false

# Android cdylib profile.
#
# `panic = "unwind"` is restated rather than inherited: the `catch_unwind`
# guards at the JNI boundary turn a pipeline panic into a Java exception
# instead of aborting the host app, and that must not silently regress if the
# release profile is ever changed.
#
# Thin LTO rather than fat: the cdylib carries ~23 MB of embedded ONNX and fat
# LTO on it is punishing for the benefit.
[profile.android]
inherits = "release"
panic = "unwind"
lto = "thin"
strip = "symbols"

# Profile for debug-logging builds without LTO for faster compilation
[profile.debug-fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
debug = true
strip = false
