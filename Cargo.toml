[package]
build = "build.rs"
name = "lege"
version = "1.4.53"
edition = "2024"
description = "Document binarization and re-encoding especially for E-Ink ebook readers"
authors = ["Lege Apps"]
homepage = "https://www.legeapp.com"
repository = "https://github.com/LegeApp/Lege/"
keywords = ["pdf", "ocr", "ebook", "e-ink", "image-processing"]
categories = ["multimedia::images", "text-processing"]

[workspace]
members = [
    ".",  # The root crate
    "lege-gpu",
    "lege-ocr",
    "djvulibrust",
    "legencode",
    "legencode/src/jbig2enc-rust",
    "legencode/src/TooJpeg-rust",
    "GUI/Freya",
]
default-members = [
    ".",
    "GUI/Freya",
]

[workspace.lints.rust]
unused_imports = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(windows_slim_errors)', 'cfg(trace_arith)', 'cfg(feature, values("cotinga-theme", "debug-logging", "german", "tesseract-ocr", "trace_arith"))'] }

[workspace.dependencies]
anyhow = { version = "1.0.100", features = ["backtrace"] }
proc-macro2 = { version = "1.0", default-features = false }
quote = { version = "1.0", default-features = false }
syn = { version = "2.0", default-features = false }
num_cpus = "1.17"
serde = { version = "1.0.228", features = ["derive"] }
config = { version = "0.14.1", features = ["toml"] }
thiserror = "1.0.69"
serde_json = "1.0.149"
log = "0.4.29"
once_cell = "1.21.3"
rayon = "1.11.0"
image = { version = "0.25.9", features = ["png", "jpeg", "tiff"] }
lopdf = "0.39.0"
flume = "0.11"
pdfium-render = { version = "0.8.37", features = ["thread_safe", "sync"] }
tempfile = "3.24.0"
flate2 = "1.1.8"
zip = { version = "8.6.0", default-features = false }
miniz_oxide = "0.8"
lazy_static = "1.5.0"
ndarray = { version = "0.17.2", features = ["rayon"] }
bytemuck = { version = "1.25.0", features = ["derive", "extern_crate_alloc"] }
cfg-if = "1.0.4"
html-escape = "0.2.13"
itertools = "0.12.1"
console = "0.15.11"
dialoguer = { version = "0.11.0", features = ["fuzzy-select"] }
console_error_panic_hook = "0.1.7"
ttf-parser = "0.21.1"
encoding_rs = "0.8.35"
wait-timeout = "0.2.1"
byteorder = "1.5.0"
bitvec = "1.0.1"
chrono = "0.4.43"

freya = { path = "freya-main/crates/freya", version = "0.4.0-rc.17" }
freya-core = { path = "freya-main/crates/freya-core", version = "0.4.0-rc.17" }
torin = { path = "freya-main/crates/torin", version = "0.4.0-rc.17" }
ragnarok = { path = "freya-main/crates/ragnarok", version = "0.4.0-rc.17" }
freya-clipboard = { path = "freya-main/crates/freya-clipboard", version = "0.4.0-rc.17" }
freya-edit = { path = "freya-main/crates/freya-edit", version = "0.4.0-rc.17" }
freya-winit = { path = "freya-main/crates/freya-winit", version = "0.4.0-rc.17" }
freya-components = { path = "freya-main/crates/freya-components", version = "0.4.0-rc.17" }
pathgraph = { path = "freya-main/crates/pathgraph", version = "0.4.0-rc.17" }
freya-animation = { path = "freya-main/crates/freya-animation", version = "0.4.0-rc.17" }
freya-router = { path = "freya-main/crates/freya-router", version = "0.4.0-rc.17" }
freya-router-macro = { path = "freya-main/crates/freya-router-macro", version = "0.4.0-rc.17" }
freya-testing = { path = "freya-main/crates/freya-testing", version = "0.4.0-rc.17" }
freya-i18n = { path = "freya-main/crates/freya-i18n", version = "0.4.0-rc.17" }
freya-performance-plugin = { path = "freya-main/crates/freya-performance-plugin", version = "0.4.0-rc.17" }
freya-radio = { path = "freya-main/crates/freya-radio", version = "0.4.0-rc.17" }
freya-render-api = { path = "freya-main/crates/freya-render-api", version = "0.4.0-rc.17" }
freya-render-tiny-skia = { path = "freya-main/crates/freya-render-tiny-skia", version = "0.4.0-rc.17" }
freya-engine = { path = "freya-main/crates/freya-engine", version = "0.4.0-rc.17" }
freya-text-cosmic = { path = "freya-main/crates/freya-text-cosmic", version = "0.4.0-rc.17" }
freya-devtools = { path = "freya-main/crates/freya-devtools", version = "0.4.0-rc.17" }
freya-icons = { path = "freya-main/crates/freya-icons", features = ["all"], version = "0.4.0-rc.17" }
freya-sdk = { path = "freya-main/crates/freya-sdk", features = ["all"], version = "0.4.0-rc.17" }
freya-material-design = { path = "freya-main/crates/freya-material-design", version = "0.4.0-rc.17" }
freya-plotters-backend = { path = "freya-main/crates/freya-plotters-backend", version = "0.4.0-rc.17" }
freya-query = { path = "freya-main/crates/freya-query", version = "0.4.0-rc.17" }
freya-webview = { path = "freya-main/crates/freya-webview", version = "0.4.0-rc.17" }
freya-terminal = { path = "freya-main/crates/freya-terminal", version = "0.4.0-rc.17" }
freya-code-editor = { path = "freya-main/crates/freya-code-editor", version = "0.4.0-rc.17", features = ["rust"] }
freya-skia-safe = { version = "0.96.1", default-features = false }
generational-box = "0.7"
tracing = "0.1.41"
bitflags = "2.9.3"
futures-util = "0.3.31"
futures-channel = "0.3.31"
futures-lite = "2.6.1"
async-io = "2.5.0"
blocking = "1.6.2"
ureq = "3.1.4"
url = "2.5"
open = "5.1"
async-broadcast = "0.7.2"
easer = "0.3.0"
ropey = "1.6.1"
keyboard-types = "0.8.0"
euclid = "0.22.9"
bytes = "1.10.1"
rfd = "0.17"
cosmic-text = "0.19.0"
softbuffer = "0.4.8"
tiny-skia = "0.12.0"
raw-window-handle = "0.6.0"
winit = "0.30.13"
tray-icon = "0.21"
gl = "0.14.0"
glutin = "0.32.0"
glutin-winit = "0.5.0"
ash-window = "0.13.0"
accesskit = "0.24.0"
accesskit_winit = "0.32.0"
hotpath = "0.14"
tokio = { version = "1.49", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "fs"] }
ash = { version = "0.38", default-features = false, features = ["loaded"] }
rustc-hash = "2.1.1"

windows = { version = "0.62.2", default-features = false }
windows-core = { version = "0.62.2", default-features = false }
windows-future = { version = "0.3.2", default-features = false }


resolver = "2"

# Vendored LegeApp/freya fork (freya-main/) and rfd (GUI/rfd/) live in this repo.
[patch."https://github.com/LegeApp/freya.git"]
freya = { path = "freya-main/crates/freya" }
freya-core = { path = "freya-main/crates/freya-core" }
freya-components = { path = "freya-main/crates/freya-components" }
freya-engine = { path = "freya-main/crates/freya-engine" }
freya-winit = { path = "freya-main/crates/freya-winit" }
freya-edit = { path = "freya-main/crates/freya-edit" }
freya-clipboard = { path = "freya-main/crates/freya-clipboard" }
freya-animation = { path = "freya-main/crates/freya-animation" }
freya-performance-plugin = { path = "freya-main/crates/freya-performance-plugin" }
torin = { path = "freya-main/crates/torin" }

[[bin]]
name = "lege"
path = "src/main.rs"


[build-dependencies]
winres = "0.1.12"  # Updated
chrono = "0.4"

[dependencies]
app_dirs2 = "2.5.5"
directories = "6.0.0"
fax = { version = "0.2.6", default-features = false }
anyhow = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
fontdue = "0.9.3"
png = "0.17.16"
image = { workspace = true }
# Enhanced CLI dependencies
dialoguer = { workspace = true }
config = { workspace = true }
dirs = "5.0.1"
toml = "0.8.23"
pdfium-render = { version = "0.8.37", features = ["thread_safe", "sync"] }  # Updated
rayon = { workspace = true }
once_cell = { workspace = true }
tempfile = { workspace = true }
lopdf = { workspace = true }
colored = "3.1.1"
serde = { workspace = true }
serde_json = { workspace = true }
flate2 = { workspace = true }
fast_image_resize = { version = "6.0.0" }
bytemuck = { workspace = true }
lazy_static = { workspace = true }
ndarray = { workspace = true }
Legencode = { path = "legencode" }
lege-gpu = { path = "lege-gpu" }
lege-ocr = { path = "lege-ocr" }
epub-builder = "0.8"
quick-xml = "0.38.4"
# mimalloc = "0.1"  # Comment out mimalloc to avoid cross-compilation issues
sysinfo = "0.31.4"
shlex = "1.3.0"
cfg-if = { workspace = true }
html-escape = { workspace = true }
chrono = { version = "0.4.43", features = ["serde"] }
memmap2 = "0.9.9"
winres = "0.1.12"
libloading = "0.8.9"
num_cpus = { workspace = true }
ttf-parser = { workspace = true }
encoding_rs = { workspace = true }
wait-timeout = { workspace = true }
bytes = "1.11.0"
console = { workspace = true }
rustc-hash = "1.1.0"
env_logger = "0.10"
tokio = { version = "1.49", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "fs"] }
futures = "0.3"
async-trait = "0.1"
regex = "1.12.2"
unicode-normalization = "0.1"
indicatif = { version = "0.17", features = ["tokio"] }
sha2 = { version = "0.10", default-features = false, features = ["std"] }
parking_lot = "0.12"
flume = { workspace = true }
zip = { workspace = true, features = ["deflate"] }
djvu_encoder = { path = "djvulibrust" }

[target.'cfg(target_os = "linux")'.dependencies]
ash = { version = "0.38", default-features = false, features = ["loaded"] }
tesseract = { version = "0.14", optional = true }
wgpu = "29.0.3"
pollster = "0.4"
libc = "0.2"

# macOS-specific dependencies
[target.'cfg(target_os = "macos")'.dependencies]
tesseract = { version = "0.14", optional = true }
wgpu = "29.0.3"
pollster = "0.4"
libc = "0.2"

# Windows-specific dependencies
[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3.9", features = ["fileapi", "winbase", "sysinfoapi", "psapi"] }
windows = { workspace = true, features = [
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Console",
] }
windows-core = { workspace = true }
windows-future = { workspace = true }

# Debug dependencies for standalone JBIG2 creation
jbig2 = { package = "jbig2enc-rust", path = "legencode/src/jbig2enc-rust" }
ndarray = "0.17.2"

[features]
default = ["jp2-lam", "tesseract-ocr"]
static = ["pdfium-render/static"]
debug-logging = ["Legencode/debug-logging", "lege-gpu/debug-logging"]
jp2-lam = ["Legencode/jp2-lam"]
tesseract-ocr = ["dep:tesseract", "lege-ocr/tesseract-ocr"]
# Feature for profiling with debug symbols - enables both debug logging and debug symbols
profiling = ["debug-logging"]
debug-layers = []
no-include-shaders = []
djvu_debug = []
german = []
# Static linking features for pdfium-render
libstdcpp = ["pdfium-render/libstdc++"]
libcpp = ["pdfium-render/libc++"]

[dev-dependencies]
flamegraph = "0.6"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
debug = false
strip = "symbols"
incremental = false
overflow-checks = false

# Optimize incremental compilation
[profile.dev]
incremental = true
codegen-units = 256
split-debuginfo = "packed"

# Profile for debug-logging builds with debug symbols enabled for flamegraph profiling
[profile.profiling]
inherits = "release"
lto = false        # Disable LTO for faster compilation during profiling
codegen-units = 16  # Allow more codegen units for faster builds
incremental = true  # Enable incremental compilation
debug = true
strip = false

# Profile for debug-logging builds without LTO for faster compilation
[profile.debug-fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
debug = true
strip = false

[package.metadata.deb]
maintainer = "Lege Apps <read@legeapp.com>"
copyright = "2025, Lege Apps"
extended-description = """\
Lege helps you prepare a scanned book PDF for pleasant reading on E-ink readers. Automatic selective text binarization and optimal per-page re-encoding. """
depends = "tesseract-ocr"
section = "graphics"
priority = "optional"
features = []
default-features = false
profile = "release"
assets = [
    # Install CLI and GUI binaries directly into PATH
    ["target/release/lege", "usr/bin/lege", "755"],
    ["target/release/lege-gui", "usr/bin/lege-gui", "755"],
    # Required shared libraries
    ["/home/dk/Desktop/lege-run/installer/linux64/libpdfium.so", "usr/lib/lege/", "644"],
    # ONNX models
    ["/home/dk/Desktop/lege-run/installer/linux64/yolo-layout.onnx", "usr/share/lege/models/", "644"],
    ["/home/dk/Desktop/lege-run/installer/linux64/sauvola.onnx", "usr/share/lege/models/", "644"],
    # Tesseract data
    ["/home/dk/Desktop/lege-run/installer/linux64/eng.traineddata", "usr/share/lege/tessdata/", "644"],
    # Desktop integration
    ["lege.desktop", "usr/share/applications/", "644"],
    ["assets/icon.png", "usr/share/icons/hicolor/256x256/apps/lege.png", "644"],
]

# Point cargo-deb to the directory that contains maintainer scripts (postinst, postrm, etc.)
# No maintainer scripts; rely on Debian triggers to update desktop/icon caches
