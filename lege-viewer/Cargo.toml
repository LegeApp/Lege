[package]
# The native viewer frontend. It is an alternative to the default Freya
# processor GUI (package `lege-gui-freya`, bin `lege-gui`), so both the
# package and its binary are named `lege-viewer` — the two used to collide on
# a shared `lege-gui` bin name and silently overwrite each other's output.
name = "lege-viewer"
description = "Native Lege document viewer and processing workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "lege-viewer"
path = "src/main.rs"

[lib]
name = "lege_viewer"
path = "src/lib.rs"

[[example]]
name = "pdf_parallel_profile"
path = "examples/pdf_parallel_profile.rs"
required-features = ["pdf-engine"]

[[example]]
name = "pdf_tile_profile"
path = "examples/pdf_tile_profile.rs"
required-features = ["pdf-engine"]

[features]
default = ["wgpu-presenter", "softbuffer-presenter", "pdf-engine"]
softbuffer-presenter = ["dep:softbuffer"]
pdf-engine = [
    "dep:pdf-source",
    "dep:pdf-document",
    "dep:pdf-content",
    "dep:pdf-text",
    "dep:pdf-page-ir",
    "dep:pdf-render-api",
    "dep:pdf-render-cpu",
    "dep:pdf-render-wgpu",
]
wgpu-presenter = ["dep:lege-gpu"]

[dependencies]
arc-swap.workspace = true
crossbeam-channel.workspace = true
thiserror.workspace = true
winit.workspace = true
cosmic-text.workspace = true
copypasta.workspace = true
pdf-font.workspace = true
tempfile.workspace = true
open.workspace = true
# The same vendored dialog crate both Lege GUIs use.
rfd = { path = "../lege-process/GUI/rfd" }
serde.workspace = true
serde_json.workspace = true
softbuffer = { workspace = true, optional = true }
lege-gpu = { path = "../lege-gpu", optional = true, features = ["presentation"] }

pdf-source = { workspace = true, optional = true }
pdf-document = { workspace = true, optional = true }
pdf-content = { workspace = true, optional = true }
pdf-text = { workspace = true, optional = true }
pdf-page-ir = { workspace = true, optional = true }
pdf-render-api = { workspace = true, optional = true }
pdf-render-cpu = { workspace = true, optional = true }
pdf-render-wgpu = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
pdf-test-support.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
