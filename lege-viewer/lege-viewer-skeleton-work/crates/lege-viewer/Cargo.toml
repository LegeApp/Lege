[package]
name = "lege-viewer"
description = "Reader-first viewer skeleton tightly integrated with the Lege PDF document engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "lege-viewer"
path = "src/main.rs"

[features]
default = ["softbuffer-presenter"]
softbuffer-presenter = ["dep:softbuffer"]
pdf-engine = [
    "dep:pdf-source",
    "dep:pdf-document",
    "dep:pdf-content",
    "dep:pdf-text",
    "dep:pdf-page-ir",
    "dep:pdf-render-api",
    "dep:pdf-render-cpu",
]
# Architectural seam only. The supplied renderer's wgpu crate is still a
# capability placeholder, so this does not yet enable a real compositor.
wgpu-presenter = []

[dependencies]
arc-swap.workspace = true
crossbeam-channel.workspace = true
thiserror.workspace = true
winit.workspace = true
softbuffer = { workspace = true, optional = true }

pdf-source = { workspace = true, optional = true }
pdf-document = { workspace = true, optional = true }
pdf-content = { workspace = true, optional = true }
pdf-text = { workspace = true, optional = true }
pdf-page-ir = { workspace = true, optional = true }
pdf-render-api = { workspace = true, optional = true }
pdf-render-cpu = { workspace = true, optional = true }

[lints]
workspace = true
