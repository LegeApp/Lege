[package]
name = "lege-pdf-read"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
description = "Lege-owned document intake seam over the external PDF renderer"

[dependencies]
thiserror = { workspace = true }
image = { workspace = true }
pdf-content = { workspace = true }
pdf-document = { workspace = true }
# `src/font_metrics.rs` only. `pdf-font` already links skrifa at this exact
# version, so this compiles no new crate -- it just makes the parser this crate
# is already pulling in reachable by name. Keep the version in step with
# `lege-pdf/render/crates/pdf-font/Cargo.toml`.
skrifa = "0.44.0"
pdf-object = { workspace = true }
pdf-page-ir = { workspace = true }
pdf-read = { workspace = true }
pdf-render-api = { workspace = true }
pdf-render-cpu = { workspace = true }
pdf-security = { workspace = true }
pdf-source = { workspace = true }
pdf-text = { workspace = true }

[dev-dependencies]
jpeg-encoder = { workspace = true }
pdf-test-support = { workspace = true }

[lints]
workspace = true
