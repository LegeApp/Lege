# The PDFium differential oracle (roadmap line 18: "the differential-testing
# oracle"; README: tools/ = "PDFium reference-render comparison tooling").
#
# Deliberately OUTSIDE the workspace: it needs a prebuilt libpdfium.so, which
# is not a dependency of the engine and must never become one. The engine
# never links PDFium; this tool loads it at runtime purely to grade us.
[package]
name = "pdfium-diff"
version = "0.0.0"
edition = "2021"
publish = false

[features]
default = []
dhat-heap = ["dep:dhat"]
# Opt-in structured stage timers for `profile` / `pipeline-profile`. Leave off
# for `bench` so Instant/counter instrumentation is not compiled into the
# hot path (content / cpu / scheduler).
bench-profiling = [
    "pdf-content/profiling",
    "pdf-document/profiling",
    "pdf-render-cpu/profiling",
    "pdf-render-scheduler/profiling",
]
renderer-pdfium = []
renderer-hayro = []
renderer-poppler = []
renderer-mupdf = []
renderer-ghostscript = []
renderer-pdfjs = []
all-renderers = [
    "renderer-pdfium",
    "renderer-hayro",
    "renderer-poppler",
    "renderer-mupdf",
    "renderer-ghostscript",
    "renderer-pdfjs",
]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Foundation",
] }

[dependencies]
dhat = { version = "0.3.3", optional = true }
libloading = "0.8"
# Not a workspace member (this tool is deliberately outside the workspace —
# see the header), so the version is spelled out rather than inherited. Keep it
# in step with `png` in the root `[workspace.dependencies]`.
png = "0.18"
font8x8 = "0.3"
# Timing benches measure hot-path speed: leave `profiling` off so Instant/
# counter instrumentation is not compiled into content/cpu/scheduler.
# Re-enable for `profile` / `pipeline-profile` structured reports:
#   cargo build --release --features bench-profiling
pdf-content = { path = "../../crates/pdf-content" }
pdf-document = { path = "../../crates/pdf-document" }
pdf-source = { path = "../../crates/pdf-source" }
pdf-page-ir = { path = "../../crates/pdf-page-ir" }
pdf-render-api = { path = "../../crates/pdf-render-api" }
pdf-render-cpu = { path = "../../crates/pdf-render-cpu" }
pdf-render-scheduler = { path = "../../crates/pdf-render-scheduler" }
pdf-font = { path = "../../crates/pdf-font" }
pdf-profiling = { path = "../../crates/pdf-profiling" }

[workspace]

[profile.release]
debug = "line-tables-only"
