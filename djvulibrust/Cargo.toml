#> On our 50-page IW44 s100 benchmark, DJVULibRust is slightly faster than djvu-rs while producing a smaller file and dramatically better reconstruction quality. The PSNR gap is about 14.7 dB, roughly 29x lower MSE, and the visual output is much more faithful on the yellowed page test set.

[package]
name = "djvu_encoder"
version = "0.10.0"
edition = "2024"
autotests = true
autoexamples = true

[features]
simd = ["dep:wide"]  # Stable portable SIMD kernels (src/simd), see llm-docs/SIMD_AND_PARALLELISM_PLAN.md
asm_zp = []        # Use assembly ZP arithmetic coder (currently bit-incorrect, experimental — see plan doc)
dev_asm_cmp = []   # Enable assembly vs Rust ZP comparison tests
rayon = ["dep:rayon"]
iw44-trace = []    # Enable IW44 debug tracing (verbose)
debug-logging = []

[dependencies]
byteorder = "1.5"
thiserror = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
log = "0.4"
bitvec = "1.0"
rayon = { version = "1.11", optional = true }
wide = { version = "=0.7.33", optional = true }

[dev-dependencies]
tempfile = "3.24"
chrono = "0.4"
image = "0.25.9"

# NOTE: Profile settings moved to workspace root Cargo.toml
