[package]
name = "jbig2enc-rust"
version = "0.2.0"
edition = "2021"
description = "JBIG2 encoder implementation in Rust with PDF fragment support"
license = "MIT OR Apache-2.0"

[lib]
name = "jbig2enc_rust"
path = "src/lib.rs"

[dependencies]
tracing = { version = "0.1", features = ["std"], optional = true }
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "registry", "std"], optional = true }
ndarray = "0.16.1"
anyhow = "1.0.100"
log = "0.4"
env_logger = "0.10"
byteorder = "1.5"
serde_json = "1.0"
bitvec = "1.0"
lutz = "1.4.1"
smallvec = "1.15"
tinyvec = "1.10"
bitfrob = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
fnv = "1.0"
derive_builder = "0.20.2"
once_cell = "1.21"

[build-dependencies]
vergen = { version = "9.1.0", default-features = false, features = ["build"] }

[features]
default = ["tracing"]
tracing = ["dep:tracing", "dep:tracing-subscriber"]
trace_encoder = ["dep:tracing", "dep:tracing-subscriber"]
line_verify = []
cc-analysis = []  # Connected component analysis for symbol dictionaries

[dev-dependencies]
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "registry", "std"] }
which = "8.0.0"
tempfile = "3.24"
hex-literal = "1.1.0"

# NOTE: Profile settings moved to workspace root Cargo.toml
# [profile.test]
# Profile-specific settings go here
