[package]
name = "jbig2enc-rust"
version = "0.3.0"
edition = "2024"
description = "JBIG2 encoder implementation in Rust with PDF fragment support"
license = "MIT OR Apache-2.0"

[lib]
name = "jbig2enc_rust"
path = "src/lib.rs"

[dependencies]
tracing = { version = "0.1", features = ["std"], optional = true }
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "registry", "std"], optional = true }
clap = { version = "4.5.41", features = ["derive"] }
ndarray = { workspace = true }
bytemuck = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
env_logger = "0.10"
byteorder = { workspace = true }
lopdf = { workspace = true }
serde_json = { workspace = true }
glob = "0.3"
bitvec = { workspace = true }
lutz = "1.4.1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
smallvec = "1.15"
tinyvec = "1.9"
bitfrob = "1.3"
serde = { workspace = true }
serde_derive = "1.0"
chrono = { workspace = true }
fnv = "1.0"
derive_builder = "0.20.2"
lazy_static = { workspace = true }
once_cell = { workspace = true }
rustc-hash = "1.1"

[build-dependencies]
vergen = { version = "9.0.6", default-features = false, features = ["build"] }

[features]
default = []
tracing = ["dep:tracing", "dep:tracing-subscriber"]
trace_encoder = ["dep:tracing", "dep:tracing-subscriber"]
trace_arith = []
line_verify = []
cc-analysis = []
symboldict = ["cc-analysis"]

[dev-dependencies]
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "registry", "std"] }
which = "8.0.0"
tempfile = "3.20"
hex-literal = "1.0.0"

# NOTE: Profile settings moved to workspace root Cargo.toml
# [profile.test]
# Profile-specific settings go here
