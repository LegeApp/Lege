[package]
name = "jbig2enc-rust"
version = "0.2.0"
edition = "2021"
description = "JBIG2 encoder implementation in Rust with PDF fragment support"
license = "MIT OR Apache-2.0"

[lib]
name = "jbig2enc_rust"
path = "src/lib.rs"

[dependencies]
tracing = { version = "0.1", features = ["std"], optional = true }
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "registry", "std"], optional = true }
clap = { version = "4.5.41", features = ["derive"] }
ndarray = "0.16.1"
bytemuck = "1.0"
anyhow = "1.0.98"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
byteorder = "1.4"
lopdf = "0.31"
serde_json = "1.0"
glob = "0.3"
bitvec = "1.0"
lutz = "1.4.1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
smallvec = "1.15"
tinyvec = "1.9"
bitfrob = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
chrono = "0.4"
fnv = "1.0"
derive_builder = "0.20.2"
lazy_static = "1.5.0"
once_cell = "1.21"
rustc-hash = "1.1"

[build-dependencies]
vergen = { version = "9.0.6", default-features = false, features = ["build"] }

[features]
default = ["tracing"]
tracing = ["dep:tracing", "dep:tracing-subscriber"]
trace_encoder = ["dep:tracing", "dep:tracing-subscriber"]
line_verify = []

[dev-dependencies]
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "registry", "std"] }
which = "8.0.0"
tempfile = "3.20"
hex-literal = "1.0.0"

# NOTE: Profile settings moved to workspace root Cargo.toml
# [profile.test]
# Profile-specific settings go here
