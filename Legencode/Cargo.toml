[package]
name = "Legencode"
version = "0.1.0"
edition = "2024"
description = "A unified image encoding crate for JPEG, JP2, JBIG2, and CCITT4"
license = "MIT"
authors = ["Your Name <your.email@example.com>"]
repository = "https://github.com/yourusername/image_codecs"
homepage = "https://github.com/yourusername/image_codecs"
documentation = "https://docs.rs/image_codecs"
keywords = ["jpeg", "jp2", "jbig2", "ccitt4", "image"]
categories = ["multimedia::encoding"]

[lib]
name = "Legencode"
path = "src/lib.rs"

[dependencies]
# Direct dependencies used by streamline.rs
fax = { version = "0.2.6", default-features = false }  # External dependency for CCITT4 encoding
ndarray = { workspace = true }          # Used directly for JBIG2 Array2 types - match jbig2 crate version
anyhow = { workspace = true }              # For error handling in lib.rs
uuid = { version = "1.20", features = ["v4"] }  # For generating unique temporary filenames
flate2 = { workspace = true }                # For Flate/Zlib compression

# Dependencies for color processing modules
rayon = { workspace = true }              # For parallel processing
serde = { workspace = true }  # For serialization
image = { workspace = true }            # Used by color linearization helpers
palette = { workspace = true }  # Used by linear RGB -> luma conversion
lazy_static = { workspace = true }       # Used by LUT initialization in linearize.rs
thiserror = { workspace = true }        # Used by ColorOpsError derive
png = "0.17"                # For PNG encoding/decoding
ort = { path = "../ort", default-features = false, features = ["std", "ndarray", "tracing", "load-dynamic"] }
once_cell = { workspace = true }          # For global static initialization

# Additional dependencies for jbig2enc-rust
bitvec = { workspace = true }              # For bit manipulation
byteorder = { workspace = true }           # For byte order handling
serde_json = { workspace = true }          # For JSON serialization
log = { workspace = true }                 # For logging

# Local path dependencies - these will pull in their own dependencies
toojpeg = { path = "src/TooJpeg-rust" }  # Local JPEG encoder
openjp2 = { path = "src/openjp2", optional = true }  # Optional JP2 encoder (legacy), disabled by default
jp2lam = { git = "https://github.com/LegeApp/jp2lam.git", optional = true }  # Pure-Rust JPEG 2000 encoder
jbig2enc-rust = { path = "src/jbig2enc-rust", default-features = false, features = ["cc-analysis", "symboldict"] }   # Local JBIG2 encoder

# Configuration management
config = { workspace = true }

[features]
default = []
debug-logging = []  # No longer requires chrono
cc-analysis = []  # Enable new connected component analysis for JBIG2 (cjb2-based)
jp2-openjp2 = ["dep:openjp2"]
jp2-lam = ["dep:jp2lam"]  # Pure-Rust JPEG 2000 via jp2lam

[dev-dependencies]
# Only keep dev dependencies that are used by the main crate's tests
criterion = { version = "0.5", features = ["html_reports"] } # For benchmarks if needed

# [[bench]]
# name = "benchmarks"
# harness = false

# NOTE: Profile settings moved to workspace root Cargo.toml
# [profile.release]
# lto = "fat"
# codegen-units = 1
