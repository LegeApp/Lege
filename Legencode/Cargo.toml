[package]
name = "Legencode"
version = "1.0.0"
edition = "2021"
description = "A unified image encoding crate for JPEG, JP2, JBIG2, and CCITT4"
license = "MIT"
authors = ["Your Name <your.email@example.com>"]
repository = "https://github.com/yourusername/image_codecs"
homepage = "https://github.com/yourusername/image_codecs"
documentation = "https://docs.rs/image_codecs"
keywords = ["jpeg", "jp2", "jbig2", "ccitt4", "image"]
categories = ["multimedia::encoding"]

[lib]
name = "Legencode"
path = "src/lib.rs"

[dependencies]
# Direct dependencies used by streamline.rs
fax = { version = "0.2.6", default-features = false }  # External dependency for CCITT4 encoding
ndarray = "0.16.1"          # Used directly for JBIG2 Array2 types - match jbig2 crate version
anyhow = "1.0"              # For error handling in lib.rs
uuid = { version = "1.20", features = ["v4"] }  # For generating unique temporary filenames
flate2 = "1.1.8"                # For Flate/Zlib compression

# Dependencies for color processing modules
rayon = "1.11"              # For parallel processing
serde = { version = "1.0", features = ["derive"] }  # For serialization
# image = "0.25.9"          # REMOVED: Replaced with custom image_types.rs module
png = "0.17"                # For PNG encoding/decoding
ort = { path = "../ort", default-features = false, features = ["std", "ndarray", "tracing", "load-dynamic"] }  # Local fork with WebGPU cleanup fix
once_cell = "1.21"          # For global static initialization

# Additional dependencies for jbig2enc-rust
bitvec = "1.0.1"              # For bit manipulation
byteorder = "1.5.0"           # For byte order handling
serde_json = "1.0"          # For JSON serialization
log = "0.4"                 # For logging

# Local path dependencies - these will pull in their own dependencies
toojpeg = { path = "src/TooJpeg-rust" }  # Local JPEG encoder
# openjp2 = { path = "src/openjp2" }       # Local JP2 encoder (disabled)
jbig2enc-rust = { path = "src/jbig2enc-rust", features = ["tracing", "cc-analysis"] }   # Local JBIG2 encoder

# Configuration management
config = { version = "0.14", features = ["toml"] }

[features]
default = []
debug-logging = []  # No longer requires chrono
cc-analysis = []  # Enable new connected component analysis for JBIG2 (cjb2-based)

[dev-dependencies]
# Only keep dev dependencies that are used by the main crate's tests
criterion = { version = "0.5", features = ["html_reports"] } # For benchmarks if needed

# [[bench]]
# name = "benchmarks"
# harness = false

# NOTE: Profile settings moved to workspace root Cargo.toml
