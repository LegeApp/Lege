# Generates include/lege_render.h. Regenerate after changing the ABI:
#   cbindgen --config cbindgen.toml --output include/lege_render.h
# The header is checked in so C consumers need no Rust toolchain.
language = "C"
header = """
/*
 * lege_render.h -- C ABI for the Lege PDF renderer.
 *
 * GENERATED by cbindgen from src/lib.rs. Do not edit by hand.
 *
 * LICENSING: this library links the Lege renderer, which is AGPL-3.0-only.
 * Anything you distribute against it is a combined AGPL work, including when
 * users reach it over a network (AGPL section 13).
 */"""
include_guard = "LEGE_RENDER_H"
cpp_compat = true
documentation_style = "doxy"
usize_is_size_t = true

[export]
prefix = ""

[parse]
parse_deps = false
