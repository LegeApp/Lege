[package]
name = "freya-engine"
description = "Abstract Freya's graphics APIs"
version = "0.4.0-rc.17"
edition = "2024"
license = "MIT"
authors = ["Marc Espín <mespinsanz@gmail.com>"]
readme = "../../README.md"
homepage = "https://freyaui.dev/"
repository = "https://github.com/marc2332/freya"
keywords = ["gui", "ui", "desktop", "skia", "graphics"]
categories = ["gui"]

[lints]
workspace = true

[package.metadata.docs.rs]
features = ["mocked-engine"]

[features]
mocked-engine = ["dep:glutin"]
cpu-renderer = ["mocked-engine"]
skia-engine = [
  "dep:freya-skia-safe",
  "freya-skia-safe/binary-cache",
  "freya-skia-safe/embed-icudtl",
  "freya-skia-safe/jpeg",
  "freya-skia-safe/textlayout",
  "freya-skia-safe/svg",
]
vulkan = ["dep:freya-skia-safe", "freya-skia-safe/vulkan"]
webp = ["dep:freya-skia-safe", "freya-skia-safe/webp"]

[dependencies]
bitflags = { workspace = true }
freya-skia-safe = { workspace = true, optional = true }
glutin = { workspace = true, optional = true }

[target."cfg(target_os = \"linux\")".dependencies.freya-skia-safe]
workspace = true
optional = true
features = ["textlayout", "svg", "x11", "wayland", "gl"]

[target."cfg(target_os = \"macos\")".dependencies.freya-skia-safe]
workspace = true
optional = true
features = ["textlayout", "svg", "metal"]

[target."cfg(target_os = \"windows\")".dependencies.freya-skia-safe]
workspace = true
optional = true
features = ["textlayout", "svg", "gl"]

[target."cfg(target_os = \"android\")".dependencies.freya-skia-safe]
workspace = true
optional = true
features = ["textlayout", "svg", "gl"]

[dev-dependencies]
freya-engine = { path = "./", features = ["skia-engine"] }
