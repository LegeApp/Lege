[package]
build = "build.rs"
name = "lege"
version = "1.5.0"
edition = "2024"
description = "Document binarization and re-encoding especially for E-Ink ebook readers"
authors = ["Lege Apps"]
homepage = "https://www.legeapp.com"
repository = "https://github.com/LegeApp/Lege/"
keywords = ["pdf", "ocr", "ebook", "e-ink", "image-processing"]
categories = ["multimedia::images", "text-processing"]
license = "AGPL-3.0-only"

[lib]
path = "core/lib.rs"

[[bin]]
name = "lege"
path = "core/main.rs"


[build-dependencies]
winres = "0.1.12"  # Updated

[dependencies]
# NOTE: `app_dirs2` and `directories` were removed here as unreferenced; the
# directory resolution in core/app_dirs.rs goes through `dirs` (below).
fax = { version = "0.3.0", default-features = false }
anyhow = { workspace = true }
# `log` records now actually go somewhere: core/main.rs installs a small
# stderr sink at startup. Previously no logger was ever set on desktop.
log = { workspace = true }
png = "0.18.1"
image = { workspace = true }
jpeg-encoder = { workspace = true }
dirs = "6.0.0"
# `toml` both loads and saves AppConfig now; the `config` crate it replaced
# layered the same three TOML files behind five unused format backends.
toml = "1.1.2"
rayon = { workspace = true }
tempfile = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
fast_image_resize = { version = "6.0.0" }
bytemuck = { workspace = true }
lege-gpu = { path = "../lege-gpu" }
lege-ocr = { path = "../lege-ocr", optional = true }
lege-ipc = { path = "lege-ipc" }
lege-pdf-write = { path = "../lege-pdf/write" }
lege-pdf-read = { path = "../lege-pdf/read" }
djvu_encoder = { path = "../lege-codecs/djvulibrust", features = ["simd", "rayon"] }
jbig2enc-rust = { path = "../lege-codecs/jbig2enc-rust", default-features = false, features = ["symboldict", "parallel"] }
jp2lam = { path = "../lege-codecs/jp2lam", optional = true }
quick-xml = "0.41.0"
# mimalloc = "0.1"  # Comment out mimalloc to avoid cross-compilation issues
sysinfo = "0.39.6"
# Only `Local::now().format(..)` is used; no serde-derived chrono field exists
# in this crate, so the default feature set and `serde` are both unnecessary.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# `libloading` removed: unreferenced, and its dlopen surface is a liability in
# an APK where the only loadable objects are the ones in jniLibs.
# `rt-multi-thread` and `fs` are deliberately absent: every runtime built here
# is `Builder::new_current_thread()` and nothing touches `tokio::fs`.
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
# Only `BoxFuture`, `FuturesUnordered`/`StreamExt` and `join_all` are used, all
# of which live in `futures-util`; the `futures` facade added four more crates.
futures-util = { workspace = true }
async-trait = "0.1"
regex = "1.12.2"
unicode-normalization = "0.1"
flume = { workspace = true }
zip = { workspace = true, features = ["deflate"] }
[target.'cfg(target_os = "linux")'.dependencies]
ash = { version = "0.38", default-features = false, features = ["loaded"] }
tesseract = { version = "0.15.2", optional = true }
wgpu = "30.0.0"
libc = "0.2"

# macOS-specific dependencies
[target.'cfg(target_os = "macos")'.dependencies]
tesseract = { version = "0.15.2", optional = true }
wgpu = "30.0.0"
libc = "0.2"

# Android-specific dependencies. Mirrors the Linux/macOS sections; `wgpu` is
# needed for the same reason there. Inert on desktop — a target section that
# does not match is never resolved.
[target.'cfg(target_os = "android")'.dependencies]
wgpu = "30.0.0"
libc = "0.2"
android_logger = { version = "0.15.1", optional = true }

# Windows-specific dependencies
[target.'cfg(target_os = "windows")'.dependencies]
# The WinRT OCR backend (ocr/winocr.rs) no longer exists, and the Direct3D/DXGI
# bindings belong to `wgpu`, which requests its own. The `windows` surface this
# crate uses is Win32 console control (core/main.rs, core/progress.rs) plus
# GlobalMemoryStatusEx (pipeline/helper_functions.rs) — the latter is why
# `winapi` was here, duplicating the same Win32 API through a second binding
# crate.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
] }
# `windows_core::BOOL` is the return type of the console control handler.
windows-core = { workspace = true }

[features]
# This crate builds the `lege` CLI only. The desktop GUIs are their own
# packages: `lege-gui-freya` (bin `lege-gui`, the default frontend) and
# `lege-viewer` (bin `lege-viewer`).
default = ["jp2-lam", "paddle-ocr", "layout-detection"]
# Android platform support. Gates everything under `android/`; nothing new
# compiles with the feature off, so desktop builds are unaffected. Building for
# Android without it is a hard error (see `core/lib.rs`).
android = [
    "dep:android_logger",
    "lege-gpu/android",
    # `?/` so enabling `android` does not itself pull in the optional OCR
    # crate — it only forwards when an OCR feature already enabled it.
    "lege-ocr?/android",
]
debug-logging = ["lege-gpu/debug-logging"]
jp2-lam = ["dep:jp2lam"]
layout-detection = ["lege-gpu/layout-detection"]
# Minimal worker feature set used by the Sheet Music Edition. Layout and the
# optional OCR backends remain disabled; JP2 stays available for Archive.org scans.
music-sheet = ["jp2-lam"]
# OCR and reflowable EPUB support share lege-ocr's document model. Keep both
# out of no-OCR editions unless an OCR backend explicitly enables them.
ocr = ["dep:lege-ocr"]
# PP-OCR (GPU, pure-Rust) OCR backend for Linux/macOS — the default. Replaces
# the native Tesseract dependency that blocked the macOS cross-compile.
paddle-ocr = ["ocr", "lege-ocr/paddle-ocr"]
# Legacy Tesseract backend, kept opt-in for one release before removal.
tesseract-ocr = ["ocr", "dep:tesseract", "lege-ocr/tesseract-ocr"]
# Feature for profiling with debug symbols - enables both debug logging and debug symbols
profiling = ["debug-logging"]
debug-layers = []
no-include-shaders = []
djvu_debug = []
german = []

[dev-dependencies]
flamegraph = "0.6.13"
pdf-test-support = { workspace = true }

[package.metadata.deb]
maintainer = "Lege Apps <read@legeapp.com>"
copyright = "2025, Lege Apps"
extended-description = """\
Lege helps you prepare a scanned book PDF for pleasant reading on E-ink readers. Automatic selective text binarization and optimal per-page re-encoding. """
# OCR is now the embedded PP-OCR backend (paddle-ocr) — no system Tesseract
# package is required at runtime.
section = "graphics"
priority = "optional"
features = ["jp2-lam", "paddle-ocr", "layout-detection"]
default-features = false
profile = "release"
assets = [
    # Install CLI and GUI binaries directly into PATH
    ["target/release/lege", "usr/bin/lege", "755"],
    # Produced by the `lege-gui-freya` package; build the workspace before `cargo deb`.
    ["target/release/lege-gui", "usr/bin/lege-gui", "755"],
    # Desktop integration
    ["lege.desktop", "usr/share/applications/", "644"],
    ["../lege-misc/assets/icon.png", "usr/share/icons/hicolor/256x256/apps/lege.png", "644"],
]

# Point cargo-deb to the directory that contains maintainer scripts (postinst, postrm, etc.)
# No maintainer scripts; rely on Debian triggers to update desktop/icon caches
