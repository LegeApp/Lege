[package]
name = "lege-gui-freya"
version = "1.0.0"
edition = "2024"
license.workspace = true

[[bin]]
name = "lege-gui"
path = "src/main.rs"

[features]
default = []
dark-mode = []
# Enables in-app debug tooling (debug-log viewer, Sanzo Wada theme browser).
# The GUI drives the CLI as a subprocess, so it no longer toggles the core
# crate's logging. Build via the workspace alias `cargo build-debug-logging`.
debug-logging = []

[dependencies]
# Keep this feature set aligned with the published Windows Skia binary cache.
# Slimmer sets such as only `skia-engine` request a non-existent Skia archive
# and fall back to a local LLVM/clang Skia build.
freya = { path = "../../../freya-main/crates/freya", default-features = false, features = ["cpu-renderer"] }
rfd = { path = "../rfd" }
# `rt-multi-thread` is load-bearing: src/main.rs builds `new_multi_thread()`.
# `fs`, `process` and `io-util` are not — the worker is driven with
# `std::process::Command` and read with `std::io::BufReader`.
tokio = { version = "1.49", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
anyhow = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
dirs = "6.0"
lege-ipc = { path = "../../lege-ipc" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
raw-window-handle = "0.6"
flume = { workspace = true }

[build-dependencies]
embed-resource = "3.0"

[target.'cfg(windows)'.dependencies]
# `winapi` covers the whole Windows surface here (GetConsoleWindow, ShowWindow);
# the `windows` crate was declared but never referenced.
winapi = { version = "0.3", features = ["wincon", "winuser"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
