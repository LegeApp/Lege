[package]
name = "lege-music-gui"
version = "1.0.0"
edition = "2024"
license.workspace = true

[[bin]]
name = "lege-music-gui"
path = "src/main.rs"

[features]
default = []
dark-mode = []
# Enables in-app debug tooling (debug-log viewer, Sanzo Wada theme browser).
# The GUI drives the CLI as a subprocess, so it no longer toggles the core
# crate's logging. Build via the workspace alias `cargo build-debug-logging`.
debug-logging = []

[dependencies]
# Keep this feature set aligned with the published Windows Skia binary cache.
# Slimmer sets such as only `skia-engine` request a non-existent Skia archive
# and fall back to a local LLVM/clang Skia build.
freya = { path = "../../../freya-main/crates/freya", default-features = false, features = ["cpu-renderer"] }
rfd = { path = "../rfd" }
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "macros", "fs", "time", "sync", "process", "io-util"] }
anyhow = "1.0.103"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
dirs = "6.0"
lege-ipc = { path = "../../lege-ipc" }
uuid = { version = "1.23.5", features = ["v4"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
once_cell = "1.21.4"
raw-window-handle = "0.6"
atty = "0.2.14"
flume = { workspace = true }

[build-dependencies]
embed-resource = "3.0"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["wincon", "winuser"] }
windows = { workspace = true, features = [
  "Foundation",
  "Win32_Storage_Packaging_Appx",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Com",
  "Win32_Foundation"
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
