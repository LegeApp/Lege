[workspace]

[package]
name = "jp2lam"
version = "0.3.0"
edition = "2024"
description = "Safe, native Rust JPEG 2000 encoder for document and photographic workloads"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
readme = "README.md"
documentation = "https://docs.rs/jp2lam"
homepage = "https://github.com/liminalism/lege/tree/main/lege-codecs/jp2lam"
repository = "https://github.com/liminalism/lege"
keywords = ["jpeg2000", "jpeg-2000", "jp2", "j2k", "encoder"]
categories = ["multimedia::encoding", "multimedia::images"]
include = ["Cargo.toml", "Cargo.lock", "README.md", "LICENSE-MIT", "LICENSE-APACHE", "src/**", "tests/**", "examples/**"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "jp2lam"
path = "src/bin/jp2lam.rs"
required-features = ["cli"]

[[bin]]
name = "compare_encodings"
path = "src/bin/compare_encodings.rs"
required-features = ["cli"]

[features]
default = ["simd"]
cli          = ["dep:chrono", "dep:image", "dep:zip"]
profile = []
counters = []
simd = ["dep:wide"]

[dependencies]
chrono = { version = "0.4", optional = true, default-features = false, features = ["clock"] }
image = { version = "0.25.9", optional = true, default-features = false, features = ["png"] }
memmap2 = "0.9"
rayon = { version = "1.10" }
tempfile = "3"
# `=0.7.33` is the workspace-unified `wide` pin, shared with `jbig2enc-rust`
# and `djvulibrust`. Bumping it must move all three crates together, or the
# tree compiles and links two copies of `wide`.
wide = { version = "=0.7.33", optional = true }
zip = { version = "2", optional = true, default-features = false, features = ["deflate"] }
# Shared production SSIMULACRA2 (`ssimulacra2-jpxl-1`). Default features omit
# the JXL evaluator; rust-av `ssimulacra2` stays a test-only oracle below.
jpxl-perceptual = { path = "../../../jpegXL-rs/JPXL/crates/jpxl-perceptual", version = "0.3.0", default-features = false }

[dev-dependencies]
butteraugli = "0.9.3"
image = { version = "0.25.9", default-features = false, features = ["png"] }
ssimulacra2 = "0.5.1"

[profile.release]
debug = true
lto = "fat"
codegen-units = 1
