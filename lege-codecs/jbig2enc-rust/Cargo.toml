[package]
name = "jbig2enc-rust"
version = "0.5.4"
edition = "2024"
description = "JBIG2 encoder implementation in Rust with PDF fragment support"
license = "MIT OR Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/jbig2enc-rust"
homepage = "https://github.com/LegeApp/Lege/tree/main/lege-codecs/jbig2enc-rust"
repository = "https://github.com/LegeApp/Lege"
keywords = ["jbig2", "encoder", "compression", "image", "pdf"]
categories = ["multimedia::encoding", "multimedia::images"]
include = ["Cargo.toml", "Cargo.lock", "README.md", "LICENSE-MIT", "LICENSE-APACHE", "build.rs", "src/**", "tests/**", "benches/**"]

[lib]
name = "jbig2enc_rust"
path = "src/lib.rs"

[dependencies]
# `clap` and `env_logger` serve the standalone `tester` / `halftone_tester`
# binaries only; nothing under `src/` outside `src/bin/` touches them. They are
# optional because `[[bin]] required-features` does NOT gate dependency
# resolution — left unconditional they were compiled into every library
# consumer of this crate, including the decode-only PDF renderer path.
clap = { version = "4.5.41", features = ["derive"], optional = true }
ndarray = "0.17.2"
anyhow = "1.0"
thiserror = "2.0.18"
log = "0.4"
env_logger = { version = "0.11.11", optional = true }
rustc-hash = "2.1.3"
fax = { version = "0.3.0", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"], optional = true }
rayon = { version = "1.10", optional = true }
# `=0.7.33` is the workspace-unified `wide` pin, shared with `jp2lam` and
# `djvulibrust`. Bumping it must move all three crates together, or the tree
# compiles and links two copies of `wide`.
wide = "=0.7.33"

[target.'cfg(not(windows))'.dependencies]
pprof = { version = "0.15", features = ["flamegraph"], optional = true }

[features]
# `symboldict` gates the symbol-dictionary path: connected-component analysis
# (jbig2cc.rs) -> symbol extraction -> symbol dictionary + text regions. It is on
# by default because it is the encoder's primary mode; disable it (or build with
# --no-default-features) to get the generic-region-only encoder.
# The crate is split into an `encode` half and a `decode` half over a shared
# protocol core (Gap A). The PDF renderer depends on
# `default-features = false, features = ["decode"]`.
default = ["encode", "decode", "symboldict"]
encode = []
decode = []
# Standalone command-line tools (`tester`, `halftone_tester`). Off by default so
# the library build stays lean.
cli = ["dep:clap", "dep:env_logger"]
# `trace_encoder` / `trace_arith` raise the crate's own `log` macros
# (`crate::debug!` / `crate::trace!`, defined in `encode/document.rs`) from
# compiled-out to `log::debug!` / `log::trace!`. They gate `log` usage only —
# nothing under `src/` uses `tracing`. The integration tests in
# `tests/encoder.rs` install a `tracing-subscriber` under these same cfgs, which
# the unconditional `[dev-dependencies]` entries below provide.
trace_encoder = []
trace_arith = []
line_verify = []
# The symbol-dictionary path is part of the encoder half.
symboldict = ["encode"]
refine = []
halftone_bin = ["dep:image"]
parallel = ["dep:rayon"]
profiling = ["dep:pprof"]
# Opt-in benchmark that links the C jbig2enc bridge (tests/headsup_c_vs_rust.rs).
# Empty because the bridge is provided via build-script/linker flags at bench
# time; the feature just gates compilation of that test target.
c-encoder-bench = []

[[bin]]
name = "tester"
path = "src/bin/tester.rs"
required-features = ["encode", "cli"]

[[bin]]
name = "halftone_tester"
path = "src/bin/halftone_tester.rs"
required-features = ["halftone_bin", "encode", "cli"]

[[bench]]
name = "decode"
harness = false
required-features = ["encode", "decode"]

# Integration test targets under `tests/`. `required-features` is derived from
# each file's actual imports (not blanket-applied `default`) so that
# `cargo test --all-targets` under a reduced feature set — most importantly
# `--no-default-features --features decode`, the PDF renderer's shipped
# configuration — skips targets it cannot build instead of failing the build.
# Most targets pull in `mod common`, whose `tests/common/writer.rs` helper
# needs both `encode` (`Jbig2ArithCoder`, `jbig2sym::BitImage`) and `decode`
# (`decode::huffman::HuffmanTable`), on top of whatever the target itself
# imports directly.
[[test]]
name = "comparator"
required-features = ["encode"]

[[test]]
name = "decode_alloc"
required-features = ["encode", "decode"]

[[test]]
name = "decode_chaos"
required-features = ["encode", "decode"]

[[test]]
name = "decode_generic_templates"
required-features = ["encode", "decode"]

[[test]]
name = "decode_halftone"
required-features = ["encode", "decode"]

[[test]]
name = "decode_halftone_skip"
required-features = ["encode", "decode"]

[[test]]
name = "decode_huffman"
required-features = ["encode", "decode"]

[[test]]
name = "decode_huffman_refagg"
required-features = ["encode", "decode"]

[[test]]
name = "decode_huffman_refine"
required-features = ["encode", "decode"]

[[test]]
name = "decode_intermediate"
required-features = ["encode", "decode"]

[[test]]
name = "decode_organisation"
required-features = ["encode", "decode"]

[[test]]
name = "decode_recovery"
required-features = ["encode", "decode"]

[[test]]
name = "decode_refagg"
required-features = ["encode", "decode"]

[[test]]
name = "decode_refine"
required-features = ["encode", "decode"]

[[test]]
name = "decode_refine_templates"
required-features = ["encode", "decode"]

[[test]]
name = "decode_retained_ctx"
required-features = ["encode", "decode"]

[[test]]
name = "decode_roundtrip"
required-features = ["encode", "decode"]

[[test]]
name = "decode_striped"
required-features = ["encode", "decode"]

[[test]]
name = "encode_byte_identical"
required-features = ["encode"]

# Uses `encode_symbol_dict` / `encode_page_with_symbol_dictionary` directly,
# plus `mod common` (encode + decode).
[[test]]
name = "encoder"
required-features = ["symboldict", "decode"]

[[test]]
name = "mode_comparison"
required-features = ["encode", "decode"]

# Doc comment on the file itself documents running with `--features symboldict`.
[[test]]
name = "multi_page_benchmark"
required-features = ["symboldict"]

# Calls `encode_symbol_dict` / `encode_text_region_mapped` directly.
[[test]]
name = "perf_smoke"
required-features = ["symboldict"]

# `Jbig2Config::text()` exercises symbol mode at runtime, but nothing here is
# compile-time gated on `symboldict` — `Jbig2Encoder`/`Jbig2Config` only need
# `encode`, and decoding goes through an external `jbig2dec` binary, not this
# crate's `decode` module.
[[test]]
name = "refine_pdf_lossless"
required-features = ["encode"]

# Decodes via an external `jbig2dec` binary, not this crate's `decode` module.
[[test]]
name = "roundtrip_after_fix"
required-features = ["encode"]

# `headsup_c_vs_rust` is intentionally left without a `[[test]]` entry: it
# already self-gates its entire content behind `#![cfg(feature =
# "c-encoder-bench")]` as the file's first line, which compiles to an empty,
# harmless test binary when that feature is off, regardless of `encode`.

[dev-dependencies]
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "registry", "std"] }
which = "8.0.0"
tempfile = "3.27.0"
hex-literal = "1.0.0"
criterion = "0.7"

[profile.release]
lto = "thin"
codegen-units = 1
