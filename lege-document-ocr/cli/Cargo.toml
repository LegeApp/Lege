[package]
name = "lege-document-ocr-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Business-grade local PDF OCR batch CLI"

[[bin]]
name = "lege-ocr"
path = "src/main.rs"

[dependencies]
blake3 = { workspace = true }
clap = { workspace = true }
lege-docir = { path = "../crates/docir" }
lege-document-batch = { path = "../crates/batch" }
lege-document-export = { path = "../crates/export" }
lege-document-pipeline = { path = "../crates/pipeline" }
lege-pdf-read = { path = "../../lege-pdf/read" }
serde_json = { workspace = true }

[dev-dependencies]
pdf-test-support = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
