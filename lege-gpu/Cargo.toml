[package]
name = "lege-gpu"
version = "0.1.0"
edition = "2024"
description = "Internal GPU compute backends for Lege"

[lib]
name = "lege_gpu"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
async-lock = "3.4.2"
bytemuck = { workspace = true }
log = { workspace = true }
once_cell = { workspace = true }
thiserror = { workspace = true }
image = { workspace = true }
rayon = { workspace = true }
pollster = "1.0.1"
protobuf = { version = "3.7.2", features = ["with-bytes"] }
winit = { workspace = true, optional = true }

[build-dependencies]
protobuf-codegen = "3.7.2"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
wgpu = { version = "30.0.0", default-features = false, features = ["std", "wgsl", "vulkan", "dx12"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30.0.0", default-features = false, features = ["std", "wgsl", "metal"] }

[features]
default = []
layout-detection = []
presentation = ["dep:winit"]
debug-logging = []
debug-layers = []
