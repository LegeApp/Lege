[package]
name = "lege-gpu"
version = "0.1.0"
edition = "2024"
description = "Internal GPU compute backends for Lege"

[lib]
name = "lege_gpu"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
bytemuck = { workspace = true }
log = { workspace = true }
once_cell = { workspace = true }
thiserror = { workspace = true }
image = { workspace = true }
rayon = { workspace = true }
pollster = "0.4"
protobuf = { version = "2.27.1", features = ["with-bytes"] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
wgpu = { version = "29.0.3", default-features = false, features = ["std", "wgsl", "vulkan", "dx12"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "29.0.3", default-features = false, features = ["std", "wgsl", "metal"] }

[features]
default = []
debug-logging = []
debug-layers = []
no-include-shaders = []
